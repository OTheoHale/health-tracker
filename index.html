<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow</title>
<meta name="apple-mobile-web-app-title" content="Glow">
<meta name="application-name" content="Glow">
<style>
:root, :root[data-theme="dark"]{
  /* Glow V2.1: verde marble (default), antique gold, washed complications. Black Marble swaps the stone tones below. */
  --bg:#0e2219; --panel:rgba(9,27,20,.66); --panel-2:rgba(12,34,26,.92); --sunk:rgba(255,255,255,.055); --line:rgba(236,240,226,.1); --line-strong:rgba(236,240,226,.26);
  --glass:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.015) 60%);
  --ink:#ece6d6; --muted:#b9b4a5; --faint:#8f8c81;
  --verd:#8fd9bf; --wash:#4f8a72; --brass:#cfae63; --brass-soft:rgba(207,174,99,.16);
  --accent:#8fd9bf; --accent-soft:rgba(143,217,191,.14); --accent-ink:#c3efdf; --on-accent:#08201a;
  --warn:#e2bb6b; --warn-soft:rgba(226,187,107,.16); --bad:#ee8a7a; --bad-soft:rgba(238,138,122,.14);
  --radius:20px; --radius-sm:14px; --radius-ctl:12px; --tap:42px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-marble="black"]:not([data-theme="light"]){ --bg:#0b0d0c; --panel:rgba(14,18,16,.66); --panel-2:rgba(18,24,21,.92); --line:rgba(236,228,210,.1); --line-strong:rgba(236,228,210,.26) }
:root[data-theme="light"]{
  --bg:#dfe3d8; --panel:rgba(255,253,247,.86); --panel-2:rgba(236,238,229,.95); --sunk:rgba(0,0,0,.05); --line:rgba(20,40,32,.14); --line-strong:rgba(20,40,32,.3);
  --ink:#16261f; --muted:#4f5f57; --faint:#536459;
  --verd:#2f7a62; --wash:#7fa393; --brass:#9a7a32; --brass-soft:rgba(154,122,50,.16);
  --accent:#2f7a62; --accent-soft:rgba(47,122,98,.12); --accent-ink:#1f5a47; --on-accent:#fff;
  --warn:#8a6034; --warn-soft:rgba(138,96,52,.12); --bad:#9a3b3b; --bad-soft:rgba(154,59,59,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
/* V2.1 finish: capsule bars, the water glass, the jar, steppers, the heat key. */
.grad-key.heat i{background:linear-gradient(90deg,#5b8fd6 0%,#86bdf0 28%,#e6c07a 55%,#f0a058 78%,#f07a5a 88%,#e85a4a 100%)}
.heat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.water-row{display:flex;gap:16px;align-items:center;margin:4px 0 8px}.water-row .big{margin:0}.water-row .water-num{flex:1;min-width:0}.panelcard .water-glass{flex:none;width:60px;height:84px}
.wg-water path{animation:wgWave 3.4s linear infinite}@keyframes wgWave{to{transform:translateX(40px)}}@media(prefers-reduced-motion:reduce){.wg-water path{animation:none}}
.stepper{display:flex;align-items:center;gap:4px}.stepper input{text-align:center;min-width:0}.stepper button{flex:none;width:38px;min-height:40px;border:1px solid var(--line-strong);background:var(--sunk);border-radius:var(--radius-ctl);font-size:18px;line-height:1}
.jar-row{display:flex;gap:18px;align-items:center;margin:6px 0 8px}.jar-row>div{flex:1;min-width:0}.jar-row .big{margin:0 0 2px}.jar-row progress{max-width:220px}.panelcard .jar-row .jar{flex:none;width:112px;height:146px}.panelcard .collect-row .jar{flex:none;width:64px;height:83px}.collect-row>div{flex:1;min-width:0}
.mf-window{max-width:300px;margin:0 0 10px}
.tpl-daily{align-self:center;font-size:12.5px;padding:0 4px}

html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh}
/* The polished stone: one bitmap per marble on its own fixed layer, so scrolling never repaints it; a sheen on top. */
.stone{position:fixed; inset:0; z-index:-1; background:var(--bg) center/cover no-repeat; transform:translateZ(0)}
.stone::before{content:""; position:absolute; inset:0; background:radial-gradient(110% 70% at 22% -12%,rgba(255,255,255,.07),transparent 55%),radial-gradient(80% 60% at 100% 110%,rgba(0,0,0,.42),transparent 60%)}
.stone.wash::after{content:""; position:absolute; inset:0; background:linear-gradient(160deg,rgba(96,44,170,.55),rgba(44,14,84,.6))}
:root[data-theme="light"] .stone::before{background:none}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:6px}
#areaTitle:focus,#family-heading:focus{outline:none}
[hidden]{display:none !important}
h1,h2,h3,h4{margin:0; letter-spacing:-.01em}
h1{font:600 32px/1.1 var(--serif)}
h2{font:600 20px/1.2 var(--serif)}
h3{font:600 15.5px/1.3 var(--sans)}
h4{font:600 12.5px/1.3 var(--sans); color:var(--faint); margin:12px 0 6px}
.sr{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
.hint{font-size:13px; color:var(--faint); line-height:1.5}
.cap{font-size:12px; font-weight:600; color:var(--faint); letter-spacing:.01em; margin:0 0 4px}
.big{font:600 30px/1.1 var(--serif); margin:2px 0 4px; font-variant-numeric:tabular-nums} .big small{font:500 14px var(--sans); color:var(--muted)}
.big.un{color:var(--faint); font-weight:500}
.dim{color:var(--faint); font-weight:500}
.up{color:var(--verd)} .dn{color:var(--brass)}
.link{border:0; background:transparent; color:var(--brass); font-weight:600; padding:4px 0; font-size:13.5px}
.link:hover{text-decoration:underline}

/* frame */
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.side{position:sticky; top:0; height:100vh; padding:24px 16px 16px; border-right:1px solid rgba(236,228,210,.07); background:rgba(5,8,7,.58); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); display:flex; flex-direction:column; gap:6px}
:root[data-theme="light"] .side{background:rgba(255,253,247,.6)}
@media(min-width:901px){.side{overflow-y:auto}.side>*{flex-shrink:0}}
.logo{display:flex; align-items:center; gap:6px; margin:0 0 18px}
.logo-mark{flex:0 0 42px;width:42px;height:42px;display:block}.logo-mark svg{display:block}
.wordmark{display:flex;align-items:flex-end;gap:6px;min-width:0}.wordmark svg{display:block;flex:none}.wordmark .logo-version{margin:0 0 9px}
.logo i{width:38px; height:38px; border-radius:50%; border:1.5px solid var(--brass); display:grid; place-items:center; color:var(--brass); font-style:normal; font-size:18px}
.logo b{font:600 20px/1.05 var(--serif)}
.nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:transparent; color:var(--muted); border-radius:14px; padding:0 12px; min-height:44px; font-size:14.5px; font-weight:600}
.nav button i{font-style:normal; width:18px; text-align:center; color:var(--ic,var(--faint)); display:inline-flex; justify-content:center}
.nav .nav-sep{display:block;height:1px;background:var(--line);margin:8px 6px}
.nav .nav-orb{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#f4fff9 0,#bfe9d6 10%,#56a88a 36%,#1d5a45 64%,#062019 100%);box-shadow:inset -2px -3px 4px rgba(0,0,0,.5)}
.gena-link{display:block;margin:10px 12px 0;font-size:12.5px;color:var(--muted);text-decoration:none}.gena-link:hover{color:var(--ink);text-decoration:underline}
@media(max-width:900px){.nav .nav-sep,.gena-link{display:none}}
.nav button:hover{background:var(--sunk); color:var(--ink)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(207,174,99,.22),rgba(207,174,99,.05)); color:var(--ink); box-shadow:inset 0 0 0 1px rgba(207,174,99,.45)}

.side .spacer{flex:1}
.ck{border-top:1px solid var(--line); padding-top:14px; font-size:13px}
.ck .cap{color:var(--brass)}
.side .ghostbtn{margin-top:10px; border:1px solid var(--line); background:transparent; border-radius:var(--radius-ctl); min-height:38px; font-size:13px; color:var(--muted)}
.stone-toggle{display:flex;align-items:center;justify-content:center;gap:7px}.stone-toggle .swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(207,174,99,.6);flex:none}.stone-toggle .swatch.black{background:linear-gradient(150deg,#2a2c2a,#050606)}.stone-toggle .swatch.verde{background:linear-gradient(150deg,#2b5a44,#0a1c14)}
.side .ghostbtn[aria-pressed="true"]{border-color:var(--brass); color:var(--brass)}
.content{padding:26px 30px 60px; min-width:0;container-type:inline-size; background:linear-gradient(180deg,rgba(6,9,8,.2),rgba(6,9,8,.36) 30%,rgba(6,9,8,.4))}
/* A gentle scrim keeps the veins under the numbers; chart-heavy pages get a little more. */
body[data-area="fitness"] .content,body[data-area="progress"] .content,body[data-area="data"] .content{background:linear-gradient(180deg,rgba(6,9,8,.3),rgba(6,9,8,.48) 30%,rgba(6,9,8,.52))}
:root[data-theme="light"] .content{background:none}
.topbar{display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap; margin:0 0 18px}
.topbar .t{flex:1; min-width:240px}
.topbar .t p{margin:4px 0 0; color:var(--muted); font-size:15px}
#previewBadge{border:1px solid var(--brass); color:var(--brass); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:700; letter-spacing:.06em; align-self:center}
#conn{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#conn .cap{margin:0 4px 0 0}
.conn{border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:6px 12px; text-align:left; line-height:1.15}
.conn b{display:block; font-size:13.5px} .conn small{font-size:11px; color:var(--faint)}
.notice{border-radius:var(--radius); padding:11px 14px; font-size:13.5px; line-height:1.5; margin:0 0 14px; border:1px solid var(--line); background:var(--panel); color:var(--muted)}
.notice.bad{border-color:var(--warn); color:var(--warn)} .notice strong{color:var(--ink)}

/* panels */
.panelcard{background:var(--glass),var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin:0 0 18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 10px 28px rgba(0,0,0,.22)}
:root[data-theme="light"] .panelcard{box-shadow:0 6px 20px rgba(20,40,32,.08)}
.panelcard > h2{margin:0 0 8px}
.ph{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 10px} .ph h2{flex:1; min-width:0}
.cols3{display:grid; grid-template-columns:minmax(300px,1fr) minmax(360px,1.6fr) minmax(300px,1fr); gap:18px; align-items:start}
.cols2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; align-items:stretch}
.cols2>.wide{grid-column:1/-1}.cols2>.panelcard{margin:0}
.col{min-width:0}
.story p{margin:0; font-size:15px} .story .basis{margin:8px 0 0; font-size:12.5px; color:var(--faint)}
.daynav, .weeknav{display:flex; align-items:center; gap:10px; margin:0 0 14px; flex-wrap:wrap}
.daynav b, .weeknav b{font:600 19px var(--serif)}
.nav-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--panel); font-size:18px; line-height:1}
.nextbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--brass-soft); border:1px solid var(--brass); border-radius:var(--radius); padding:12px 18px; margin:0 0 16px}
.nextbar b{font:600 18px var(--serif)} .nextbar .cap{margin:0; color:var(--brass)} .nextbar .acts{margin:0; margin-left:auto}

/* rings + three + water + sliding cards */
.rings{display:flex; align-items:center; gap:12px; margin:10px 0 6px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.rings svg{width:118px; height:118px; flex:none}
.rings .rl{font-size:13px; color:var(--muted); line-height:1.7; min-width:0} .rings .rl b{color:var(--ink)} .rings .rl i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:-1px} .rings .hint{margin:4px 0 0; line-height:1.4}
.ringarc{animation:ringfill .9s ease-out} @keyframes ringfill{from{stroke-dashoffset:var(--c)}} @media (prefers-reduced-motion:reduce){ .ringarc{animation:none} }
.three{margin-top:12px; border-top:1px solid var(--line); padding-top:10px} .trow{display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px} .trow .an{border:0; background:transparent; text-align:left; flex:1; min-width:0; padding:4px 0; color:var(--ink)} .trow .an:hover{color:var(--brass)}
.water .wn{font:600 22px var(--serif); min-width:36px; text-align:center}
@media (max-width:900px){ .cols3{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:12px; padding:0 0 8px; scrollbar-width:none} .cols3::-webkit-scrollbar{display:none} .cols3 > *{flex:0 0 88%; scroll-snap-align:start; min-width:0} .cols3 .col{display:block} }
/* relay door */
.tok{font:13px ui-monospace,Menlo,monospace; background:var(--sunk); border-radius:8px; padding:8px 10px; word-break:break-all} code{font:13px ui-monospace,Menlo,monospace; background:var(--sunk); border-radius:6px; padding:1px 5px} .steps{margin:0; padding-left:20px; font-size:14px} .steps li{margin:0 0 8px}
/* rank + photo */
.tierb{font:700 18px var(--serif); color:var(--brass)} .consist{margin:10px 0 0; border-top:1px solid var(--line); padding-top:10px} .crow{display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13.5px}
.photo{width:120px; height:120px; border-radius:50%; object-fit:cover; border:2px solid var(--brass); display:block; margin:6px auto 8px} .photo.small{width:72px; height:72px; margin:8px 0}
/* profile */
.profile .pgrid{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:start}
.xp{height:8px; border-radius:4px; background:var(--sunk); overflow:hidden; margin:4px 0} .xp i{display:block; height:100%; background:var(--brass)}
.rankring{text-align:center} .ring{width:76px; height:76px; border-radius:50%; border:2px solid var(--brass); display:grid; place-items:center; font:700 34px var(--serif); color:var(--brass); margin:0 auto 4px; background:radial-gradient(circle at 40% 35%, rgba(255,255,255,.08), transparent 60%)}
.ring.un{color:var(--faint); border-color:var(--line-strong)}
.avatar{text-align:center; margin:10px 0} .figure svg{width:120px; height:200px}
.attrs{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 0} .attrs.wide{max-width:420px}
.attr{border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center} .attr b{display:block; font:700 24px var(--serif); color:var(--brass)} .attr b.un{color:var(--faint); font-weight:500}
.orbs{display:flex; align-items:center; gap:12px; margin-top:12px; border-top:1px solid var(--line); padding-top:12px}
.orb{width:44px; height:44px; aspect-ratio:1; border-radius:50%; flex:none; position:relative; border:1px solid rgba(201,165,90,.7);
  background:radial-gradient(circle at 50% 118%, rgba(160,255,215,.5), transparent 46%), radial-gradient(circle at 34% 28%, #f4fff9 0, #bfe9d6 9%, #56a88a 34%, #1d5a45 62%, #062019 100%);
  box-shadow:inset -.22em -.3em .5em rgba(0,0,0,.55), inset .14em .18em .3em rgba(255,255,255,.18), 0 .2em .4em rgba(0,0,0,.4), 0 0 .6em rgba(127,200,169,.3)}
.orb::before{content:""; position:absolute; left:17%; top:9%; width:40%; height:26%; border-radius:50%; background:radial-gradient(ellipse at center, rgba(255,255,255,.95), rgba(255,255,255,0) 70%); transform:rotate(-25deg); pointer-events:none}
.orb-fly{position:fixed; width:16px; height:16px; z-index:60; pointer-events:none; border-width:0}
.orb-pulse{animation:orbPulse .55s ease-out}
@keyframes orbPulse{40%{transform:scale(1.18); box-shadow:inset -.22em -.3em .5em rgba(0,0,0,.55), 0 0 1.4em rgba(127,200,169,.8)}}
@media(prefers-reduced-motion:reduce){.orb-pulse{animation:none}}

/* activities */
.pill{display:inline-flex; background:var(--sunk); border-radius:999px; padding:3px} .pill button{border:0; background:transparent; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--muted); font-weight:600}
.pill button[aria-pressed="true"]{background:var(--brass-soft); color:var(--ink); box-shadow:inset 0 0 0 1px var(--brass)}
.ggrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.gcard{border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--sunk); min-height:120px}
.gh{display:flex; align-items:center; gap:8px; width:100%; border:0; background:transparent; text-align:left; font:600 16px var(--serif); padding:2px 0 8px} .gh .gi{color:var(--brass)} .gh .arr, .arr{margin-left:auto; color:var(--faint); font-size:18px}
.arow{display:flex; align-items:flex-start; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:14px} .arow .al{flex:1; min-width:0} .arow .am{display:flex; flex-wrap:wrap; gap:4px; margin-top:2px} .arow .am:empty{display:none} .arow .am .chip{white-space:normal; text-align:left}
.arow .cb{width:24px; height:24px; margin-top:2px; border-radius:7px; border:1.5px solid var(--line-strong); background:transparent; flex:none; font-size:14px; line-height:1; color:var(--on-accent)}
.arow .cb[aria-checked="true"]{background:var(--verd); border-color:var(--verd)}
.arow .an, .agrow .an{border:0; background:transparent; text-align:left; flex:1; min-width:0; padding:4px 0; font-size:14px; color:var(--ink)} .arow .an small{color:var(--faint); font-size:12px}
.arow .an:hover, .agrow .an:hover{color:var(--brass)}
.arow .arr, .agrow .arr{border:0; background:transparent; padding:0 4px}
.chip.time{border:1px solid var(--line); background:transparent; color:var(--muted); font-weight:500} button.chip.time{cursor:pointer}
.goals{display:flex; gap:14px; align-items:center; margin-top:14px; border-top:1px solid var(--line); padding-top:12px} .goals > div{flex:1} .goals p{margin:0}
.quest{margin-top:10px; font-size:14px; color:var(--muted)} .quest .cap{display:inline; margin-right:6px; color:var(--brass)}
.intent{display:flex; gap:8px; margin-top:12px} .intent input{flex:1}
.glance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.glance-tile{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--sunk)}.glance-tile .cap{margin:0}.glance-big{font-size:28px;margin:4px 0;font-variant-numeric:tabular-nums}.glance-big small{font-size:14px;color:var(--muted)}.glance-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.glance-bar i{display:block;height:100%}.glance-tile .hint{margin:6px 0}.glance-spark{position:relative;display:flex;gap:4px;align-items:flex-end;height:36px}.glance-spark span{flex:1;border-radius:3px 3px 0 0}.glance-spark em{position:absolute;left:0;right:0;border-top:1px dashed var(--muted)}.glance-dots{display:inline-flex;gap:3px;vertical-align:middle}.glance-dots i{width:8px;height:8px;border-radius:50%}.glance-cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:14px}@media(max-width:760px){.glance-cols{grid-template-columns:1fr}}.glance-cols h3{margin:0 0 6px;font-size:15px}.glance-list{list-style:none;margin:0;padding:0}.glance-list li{display:grid;grid-template-columns:40px 1fr 60px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}.glance-tag{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--t);color:var(--t)}.fitness-detail summary{cursor:pointer}
.logo-version{font-size:.62em;letter-spacing:.04em;color:var(--brass);vertical-align:middle}
#updateBar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--brass);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.ws-node .cb.src{background:#4cbf7e;border-color:#4cbf7e;color:#fff}
.ws-node .claim-one{font-size:12px;padding:3px 10px}
.sleep-grid{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.sleep-stages{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin-top:8px}.sleep-stages i{display:block}.sleep-week{position:relative;display:flex;gap:8px;align-items:flex-end;height:78px;margin-top:12px}.sleep-week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.sleep-week span{display:block;width:100%;max-width:22px;border-radius:999px;background:var(--line-strong)}.sleep-week small{color:var(--muted);font-size:11px}.sleep-week em{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);margin-bottom:18px}
.proposal{margin-top:10px; border:1px solid var(--brass); border-radius:14px; padding:12px 14px; background:var(--brass-soft)}

/* agenda + fitness */
.agrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)} .agrow .tm{min-width:92px; font-size:13px; color:var(--brass); font-weight:600}
.recent{display:grid; gap:2px; margin-top:12px; border-top:1px solid var(--line); padding-top:10px} .recent b{font:600 16px var(--serif)}

/* rows, seg, acts (shared) */
.row{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin:0 0 9px} .row.settled{background:transparent} .row.compact{padding:11px 14px}
.rowhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap} .rowhead h3{flex:1; min-width:0}
.win{font-size:12.5px; color:var(--brass); white-space:nowrap; font-weight:600}
.seg{display:flex; gap:6px; margin:8px 0 0} .seg button{flex:1; min-width:0; text-align:left; background:var(--sunk); border:1px solid transparent; border-radius:var(--radius-ctl); padding:7px 10px; min-height:var(--tap)}
.seg button[aria-checked="true"]{background:var(--accent-soft); border-color:var(--accent)} .seg b{display:block; font-size:12px; font-weight:600; color:var(--muted)} .seg button[aria-checked="true"] b{color:var(--accent-ink)} .seg small{display:block; font-size:13px; color:var(--ink); line-height:1.3}
.seg.mini button{min-height:36px; padding:5px 10px} .seg.mini small{display:none}
.acts{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; align-items:center}
.acts button, .intent button, .fields > button{border:1px solid var(--line-strong); background:transparent; border-radius:var(--radius-ctl); padding:0 14px; min-height:40px; font-size:14px; font-weight:600}
.acts button:hover{border-color:var(--brass)}
.acts .primary{background:var(--verd); border-color:var(--verd); color:var(--on-accent)}
.acts button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)} .acts .primary[aria-pressed="true"]{background:var(--verd); color:var(--on-accent)}
.acts .ghost, .ghost{border-color:transparent; background:transparent; color:var(--muted); font-weight:600} .ghost.small{min-height:32px; padding:0 8px; margin-left:auto; border:0; font-size:13px}
.acts .save, .save{border-color:var(--brass); background:var(--brass-soft); color:var(--ink)}
.acts .danger{color:var(--bad); border-color:transparent} .acts .danger.confirm{background:var(--bad-soft); border-color:var(--bad)}
.acts select, .fields select{font:inherit; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:0 8px; min-height:38px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0} .chips button{border:1px solid var(--line); background:var(--sunk); border-radius:999px; padding:0 13px; min-height:34px; font-size:13.5px} .chips button[aria-pressed="true"]{border-color:var(--brass); background:var(--brass-soft)} .chips button:hover{border-color:var(--brass)}
.state{display:flex; align-items:center; gap:7px; margin:8px 0 0; font-size:13.5px; color:var(--muted); flex-wrap:wrap}
.chip{border-radius:999px; padding:2px 9px; font-size:12px; font-weight:600; background:var(--accent-soft); color:var(--accent-ink); white-space:nowrap}
.chip.partial{background:var(--warn-soft); color:var(--warn)} .chip.skipped, .chip.quiet{background:var(--sunk); color:var(--muted)} .chip.self{background:transparent; border:1px dashed var(--line-strong); color:var(--faint); font-weight:500} .chip.demo{background:var(--brass-soft); color:var(--brass)}
.ws-node .cb.skip,.cb.skip{color:#e05a55!important;border-color:rgba(224,90,85,.85)!important;background:rgba(224,90,85,.16)!important} .cb.part{color:var(--muted);border-color:var(--line-strong)} .cb.exempt{color:var(--faint);border-style:dashed}
.skip-x{background:transparent;border:0;color:var(--faint);font-size:.8em;padding:0 4px;cursor:pointer;opacity:0} .ws-node:hover .skip-x,.skip-x:focus-visible{opacity:1;color:#d9534f} @media (hover:none){.skip-x{opacity:.6}}
.skip-btn[aria-pressed="true"]{color:#d9534f;border-color:rgba(217,83,79,.7)}
.detail, .panel{margin:10px 0 0; padding:11px 0 2px; border-top:1px solid var(--line)}
label{display:block; font-size:12.5px; color:var(--muted); margin:0 0 4px}
.fields{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap} .mins{flex:0 0 100px} .note{flex:1 1 150px; min-width:0}
input[type="text"], input[type="number"], input[type="time"], input[type="date"], select, textarea{font:inherit; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-ctl); padding:0 11px; min-height:40px; width:100%}
textarea{padding:10px 11px; min-height:64px; resize:vertical; line-height:1.4}
.form{display:grid; grid-template-columns:1fr 1fr; gap:9px 8px} .form .full{grid-column:1/-1}
.days{display:flex; gap:4px} .days label{flex:1; min-width:0; text-align:center; border:1px solid var(--line); border-radius:8px; min-height:38px; display:flex; align-items:center; justify-content:center; font-size:13px; margin:0; cursor:pointer; color:var(--ink); background:var(--sunk); position:relative}
.days label.on{background:var(--brass-soft); border-color:var(--brass); color:var(--ink); font-weight:600} .days input{position:absolute; opacity:0; width:1px; height:1px; margin:0} .days label:focus-within{outline:2px solid var(--brass); outline-offset:2px}
.radios{display:flex; gap:6px; flex-wrap:wrap} .radios label{display:flex; align-items:center; gap:6px; margin:0; color:var(--ink); font-size:14px; min-height:38px; padding:0 4px}
.subtabs{display:flex; gap:4px; margin:0 0 14px; background:var(--sunk); border-radius:14px; padding:4px; max-width:420px} .subtabs button{flex:1; border:0; background:transparent; border-radius:11px; min-height:38px; font-size:14px; color:var(--muted); font-weight:600} .subtabs button[aria-selected="true"]{background:var(--panel); color:var(--ink); box-shadow:inset 0 0 0 1px var(--brass)}
.strip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:0 0 14px; max-width:620px} .strip button{border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:6px 0; min-height:60px; display:flex; flex-direction:column; align-items:center; gap:1px}
.strip button[aria-pressed="true"]{border-color:var(--brass); background:var(--brass-soft)} .strip .dn{font-size:11px; color:var(--muted)} .strip .dd{font:600 18px var(--serif)} .strip .dc{font-size:10.5px; color:var(--faint)} .strip button.is-today .dd{color:var(--brass)}
.dayhead{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:6px 0 10px} .dayhead h2{flex:1}
.catalog{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px} .citem{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--sunk); border-radius:10px; padding:8px 10px; margin:0 0 6px; font-size:13.5px} .citem[disabled]{opacity:.5; cursor:default}
.sect{margin:18px 0 0} .sect > h2{margin:0 0 8px}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px} .tbl th{text-align:left; font-size:12px; color:var(--faint); font-weight:600; padding:6px 8px 6px 0; border-bottom:1px solid var(--line)} .tbl td{padding:7px 8px 7px 0; border-bottom:1px solid var(--line); vertical-align:top}
.stat{display:grid; grid-template-columns:auto 1fr auto; gap:8px 10px; align-items:center; font-size:14px} .stat .k{display:flex; align-items:center; gap:7px} .stat .k i, .legend i{width:10px; height:10px; border-radius:3px; display:inline-block} .stat .n{font-variant-numeric:tabular-nums; color:var(--muted)}
.c-normal{background:var(--verd) !important} .c-minimum{background:var(--wash) !important} .c-partial{background:var(--brass) !important} .c-skipped{background:var(--faint) !important} .c-none{background:var(--line) !important} .c-ahead{background:transparent !important; border:1px dashed var(--line)}
.legend{font-size:12px; color:var(--faint); margin:6px 0 0} .legend i{margin:0 4px 0 8px; vertical-align:-1px}
.panelcard svg{display:block; width:100%; height:auto; max-height:200px}
.cmp{display:grid; grid-template-columns:1fr auto auto auto; gap:6px 12px; font-size:14px; align-items:center} .cmp .h{color:var(--faint); font-size:12px; font-weight:600}
.byseries{display:grid; grid-template-columns:1fr auto; gap:6px 10px; font-size:13.5px} .byseries span:nth-child(2n){color:var(--muted); white-space:nowrap}
.filebtn{position:relative; overflow:hidden} .filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:6; max-width:560px; width:calc(100% - 32px); background:var(--ink); color:var(--bg); border-radius:12px; padding:11px 14px; display:flex; align-items:center; gap:12px; font-size:14px; box-shadow:0 8px 28px rgba(0,0,0,.35)}
#toast span{flex:1} #toast button{background:transparent; border:1px solid currentColor; border-radius:8px; padding:5px 12px; font-size:13.5px; font-weight:600; color:inherit}
footer{margin-top:24px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--faint)} footer p{margin:0 0 4px}
.ring{animation:pop .5s ease-out} @keyframes pop{from{transform:scale(.92);opacity:.6}}
@media (prefers-reduced-motion:reduce){ .ring{animation:none} *{scroll-behavior:auto !important} }
.deficit{margin:10px 0 4px}.deficit-head{margin:0 0 6px}.deficit-parts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85em;opacity:.85}
.deficit-bar{position:relative;height:8px;border-radius:4px;background:rgba(127,127,127,.22);margin:4px 0 6px;overflow:visible}.deficit-bar i{display:block;height:100%;border-radius:4px;background:#6fd39a}
.deficit.tone-close .deficit-bar i{background:#e6cf5c}.deficit.tone-behind .deficit-bar i{background:#f0a058}.deficit.tone-far .deficit-bar i{background:#e87060}
.deficit-bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:currentColor;opacity:.6}
.self-mark{margin-left:6px;font-size:.85em;opacity:.7}
/* Source freshness (Sept 24 scale): green ≤ 10 min, amber ≤ 3 h, orange ≤ 1 day, red older, grey none. */
.fresh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:#8a8f8c}.f-live{background:#6fd39a}.f-recent{background:#e6cf5c}.f-today{background:#f0a058}.f-stale{background:#e87060}
.pct{margin-left:6px;font-size:.8em;font-variant-numeric:tabular-nums;opacity:.75}
.nut-inputs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85em;margin:4px 0}.nut-inputs b{display:inline-block;min-width:1.2em;text-align:center}

/* V2.0 shell (Mintay, Sept 25): resizable sidebar, Hide beside the build line, a pop-out tab when hidden. */
.app{grid-template-columns:var(--side-w,232px) 1fr}
.side{position:sticky}
.side-foot{display:flex;gap:6px}.side-foot .ghostbtn{flex:1;margin-top:6px;min-height:32px;font-size:12px}
.side-resize{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5}
.side-resize:hover,.side-resize:focus-visible{background:linear-gradient(90deg,transparent 3px,var(--brass) 3px,var(--brass) 5px,transparent 5px);outline:none}
.side-peek{display:none;position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;width:22px;height:64px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--panel-2);color:var(--brass);font-size:16px;cursor:pointer}
.app.sidehidden ~ .side-peek,.app.sidehidden .side-peek{display:block}
.app.sidehidden.peeking{grid-template-columns:minmax(0,1fr)}
.app.sidehidden.peeking .side{display:flex;position:fixed;left:0;top:0;z-index:29;width:var(--side-w,232px);background:var(--bg,#10241c);box-shadow:8px 0 30px rgba(0,0,0,.45)}
#topbarHidePlaceholder{display:none}
.topbar #sideToggle{display:none}
.app.sidehidden .topbar #sideToggle{display:none}
#sideFresh .freshness{margin:6px 0 2px}
#sideFresh .fresh-btn{width:100%;justify-content:flex-start}
#sidebarSources #conn{gap:6px}#sidebarSources #conn .conn{font-size:11px;padding:2px 8px;min-height:24px}
.ck #ckLeft{margin:2px 0 0}
#topStats{display:flex;gap:14px;align-items:center;margin-left:auto;font-size:12.5px;color:var(--muted)}
#topStats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Goals (V2.0 Phase 5) */
.goal-row{margin:10px 0}.goal-row .gr-h{display:flex;justify-content:space-between;gap:8px}.goal-row .gr-f{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.goal-bar{position:relative;height:10px;border-radius:5px;background:rgba(127,127,127,.2);margin-top:6px}.goal-bar i{display:block;height:100%;border-radius:5px;background:#6fd39a}
.goal-bar em,.goal-bar u{position:absolute;top:-4px;bottom:-4px;width:2px}.goal-bar em{background:var(--ink);opacity:.7}.goal-bar u{background:var(--brass)}
.goal-row.small{padding-top:8px;border-top:1px solid var(--line)}.goal-setup{margin-top:12px}.goal-setup summary{cursor:pointer;color:var(--brass)}
.ck-list{list-style:none;padding:0;margin:0}.ck-list li{display:grid;grid-template-columns:1.2fr 1fr .7fr 1.4fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.ck-name{font-weight:600}

/* Faith (V2.0 Phase 7): one large Ethiopian cross, gold outline, behind the cards. */
body[data-area="faith"] .content{position:relative}

body[data-area="faith"][data-cross="soft"] .content::before{opacity:.52;filter:drop-shadow(0 0 12px rgba(255,214,130,.22))}
body[data-area="faith"] #main{position:relative;z-index:1}
body[data-area="faith"] .app:not(.railhidden) .content::before{right:calc(288px + 18px + 30px)}@media(max-width:1230px){body[data-area="faith"] .app:not(.railhidden) .content::before{right:calc(30px + 4vw)}}

<script>
/* Only the hosted surface installs a worker. The Mac wrapper serves its own bundled files from a
   fixed loopback origin and must not have a cache layer sitting between it and them; a stale shell
   there would be invisible and unfixable without clearing app storage. delivery.js is deferred, so
   it has already run by the time load fires. */
addEventListener('load', () => {
  const delivery = window.HealthDelivery;
  if (!delivery) return;
  /* A shell already waiting when the page loads applies on that load; one that arrives while the app
     is open waits behind the visible Update control, so the app never changes mid-entry. The worker
     used to wait for a restart message nothing ever sent, so a release only arrived once every
     window had been closed. */
  if ('serviceWorker' in navigator && delivery.hosted) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) {
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), {once: true});
        reg.waiting.postMessage('restart');
      }
      reg.update().catch(() => {});
    }).catch(() => {});
  }
  /* Website, phone and Mac app alike: notice a newer published build and offer it. */
  if (delivery.mode === 'local') return;
  const check = async () => {
    try {
      const text = await (await fetch('delivery.js', {cache: 'no-store'})).text();
      const found = /const BUILD = '([^']+)'/.exec(text);
      if (found && found[1] !== delivery.build) dispatchEvent(new CustomEvent('health-update', {detail: found[1]}));
    } catch (_) {}
  };
  check();
  setInterval(check, 10 * 60 * 1000);
  addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
});
</script>

  function barsSVG(days, today, weekly){

  function weekTotals(start){

  }

  const stampedBuild = () => (window.HealthDelivery && window.HealthDelivery.build) || BUILD;
  $('#build').textContent = stampedBuild()+(personalReview?' · personal review':syntheticTest?' · persistent invented-data test':'');
  window.addEventListener('load', () => { $('#build').textContent = stampedBuild()+(personalReview?' · personal review':syntheticTest?' · persistent invented-data test':''); });
  try { if (localStorage.getItem('ht-sidebar-hidden') === '1') document.querySelector('.app').classList.add('sidehidden'); } catch(err){}
  // Resizable sidebar (V2.0): drag the edge, arrows from the keyboard, double-click resets; the width is
  // remembered on this device only. Hidden, it peeks when the pointer reaches the left edge.
  (function sidebarShell(){
    const app = document.querySelector('.app'), side = document.getElementById('appSide'), grip = document.getElementById('sideResize'), MIN = 184, MAX = 380, DEF = 232;
    const setW = w => { const v = Math.max(MIN, Math.min(MAX, Math.round(w))); app.style.setProperty('--side-w', v + 'px'); return v; };
    try { const saved = +localStorage.getItem('ht-sidebar-width'); if (saved) setW(saved); } catch(_){}
    const save = w => { try { localStorage.setItem('ht-sidebar-width', String(w)); } catch(_){} };
    if (grip){
      grip.addEventListener('pointerdown', e => { e.preventDefault(); grip.setPointerCapture(e.pointerId); const move = ev => setW(ev.clientX); const up = ev => { save(setW(ev.clientX)); grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); }; grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); });
      grip.addEventListener('dblclick', () => { save(setW(DEF)); });
      grip.addEventListener('keydown', e => { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault(); const cur = side.getBoundingClientRect().width; save(setW(cur + (e.key === 'ArrowRight' ? 16 : -16))); });
    }
    document.addEventListener('mousemove', e => { if (!app.classList.contains('sidehidden')) return; if (e.clientX <= 6) app.classList.add('peeking'); else if (app.classList.contains('peeking') && e.clientX > side.getBoundingClientRect().width + 24) app.classList.remove('peeking'); });
  })();
  document.addEventListener('keydown', e => {
    if (!composer || !e.target || e.target.id !== 'wsComposerTitle') return;
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.stopImmediatePropagation(); composerSave(); }
    else if (e.key === 'Escape'){ e.preventDefault(); e.stopImmediatePropagation(); composer = null; unsavedForm = false; render(); }
  }, true);
  document.addEventListener('input', e => { if (composer && e.target && e.target.id === 'wsComposerTitle') composer.title = e.target.value; });
  $('#storeNote').textContent = 'Saved only in this browser, on this device, at this address. Not encrypted, not backed up; erased if you clear site data. Export a copy from Settings.';
  if (preview) demo = buildDemo();
  save().then(()=>{render();runAutoEvidence();});
  render();
})();
</script>
</body>
